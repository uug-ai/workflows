name: Create a new release
on:
  workflow_call:
    inputs:
      organization:
        description: 'Container organization or owner'
        required: false
        type: string
        default: 'uug-ai'
      project:
        description: 'Project or repository name'
        required: false
        type: string
        default: ''
      tag:
        description: 'Release tag to build and publish'
        required: false
        type: string
        default: ''
      docker_context:
        description: 'Docker build context'
        required: false
        type: string
        default: '.'
      hardened:
        description: 'Enforce the non-root /app/main Go worker image contract, tests, scans, provenance and signing'
        type: boolean
        default: false
      hardened_profile:
        description: 'Runtime contract: worker, frontend, api, standalone, or mongo-task'
        type: string
        default: worker
      artifact_prefix:
        description: 'Unique artifact prefix for each image call; letters, digits and underscores only'
        type: string
        default: hardened
      hardened_entrypoint:
        description: 'Expected image Entrypoint as a JSON string array or null; null requires hardened_command'
        type: string
        default: '["/app/main"]'
      hardened_command:
        description: 'Optional expected Cmd JSON array; required when the image has no entrypoint'
        type: string
        default: ''
      hardened_workdir:
        description: 'Optional expected absolute image working directory'
        type: string
        default: ''
      browser_inventory:
        description: 'Require extracted browser dependency scans/SBOM for a non-frontend runtime'
        type: boolean
        default: false
      hardened_dockerfile:
        description: 'Optional Dockerfile path for hardened native builds; empty preserves the context default'
        type: string
        default: ''
      worker_additional_smoke:
        description: 'Require image/smoke-test.sh in addition to worker queue readiness'
        type: boolean
        default: false
      smoke_predeclare_quorum:
        description: 'Provision a durable quorum queue for workers that require an existing queue'
        type: boolean
        default: false
      publish:
        description: 'Publish verified images; false runs hardened validation only'
        type: boolean
        default: true
      finalize_release:
        description: 'Publish an existing draft GitHub release after hardened image promotion succeeds'
        type: boolean
        default: false
      smoke_queue:
        description: 'RabbitMQ consumer queue required by the hardened MongoDB/RabbitMQ worker smoke test'
        type: string
        default: ''
      use_private_module_auth:
        description: 'Whether to pass GitHub credentials to Docker for private module downloads'
        required: false
        type: boolean
        default: true
      runner_matrix:
        description: 'JSON array of objects with architecture and runner keys'
        required: false
        type: string
        default: '[{"architecture":"amd64","runner":"ubuntu-24.04"},{"architecture":"arm64","runner":"sh-ubuntu-24.04-arm"}]'
      create_gitops_pr:
        description: 'Whether to create a GitOps pull request after publishing images'
        required: false
        type: boolean
        default: false
      gitops_repo:
        description: 'GitOps repository in owner/name format'
        required: false
        type: string
        default: 'uug-ai/gitops'
      gitops_file:
        description: 'GitOps file path to update'
        required: false
        type: string
        default: 'environments/staging/kerberos-hub/values.yaml'
      gitops_key:
        description: 'GitOps key path to update'
        required: false
        type: string
        default: 'kerberoshub.api.tag'
      gitops_value:
        description: 'GitOps value to set; defaults to the release tag'
        required: false
        type: string
        default: ''
      gitops_pr_branch:
        description: 'GitOps pull request branch name'
        required: false
        type: string
        default: ''
      commit_email:
        description: 'Commit author email'
        required: false
        type: string
        default: 'gitops@uug.ai'
      commit_name:
        description: 'Commit author name'
        required: false
        type: string
        default: 'GitOps - UUG.AI'
      commit_message:
        description: 'Commit message to use'
        required: false
        type: string
        default: ''
    secrets:
      USERNAME:
        required: false
      TOKEN:
        required: false

env:
  ORGANIZATION: ${{ inputs.organization || 'uug-ai' }}
  PROJECT: ${{ inputs.project || github.event.repository.name }}
  TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  BUILD_CONTEXT: ${{ inputs.docker_context || '.' }}
  RUNNER_MATRIX: ${{ inputs.runner_matrix || '[{"architecture":"amd64","runner":"ubuntu-24.04"},{"architecture":"arm64","runner":"sh-ubuntu-24.04-arm"}]' }}
  GITOPS_REPO: ${{ inputs.gitops_repo || 'uug-ai/gitops' }}
  GITOPS_FILE: ${{ inputs.gitops_file || 'environments/staging/kerberos-hub/values.yaml' }}
  GITOPS_KEY: ${{ inputs.gitops_key || 'kerberoshub.api.tag' }}
  GITOPS_VALUE: ${{ inputs.gitops_value || inputs.tag || github.event.release.tag_name || github.ref_name }}
  GITOPS_PR_BRANCH: ${{ inputs.gitops_pr_branch || format('release-{0}-{1}', inputs.project || github.event.repository.name, inputs.tag || github.event.release.tag_name || github.ref_name) }}
  COMMIT_EMAIL: ${{ inputs.commit_email || 'gitops@uug.ai' }}
  COMMIT_NAME: ${{ inputs.commit_name || 'GitOps - UUG.AI' }}
  COMMIT_MESSAGE: ${{ inputs.commit_message || format('A new release for {0} - {1}', inputs.project || github.event.repository.name, inputs.tag || github.event.release.tag_name || github.ref_name) }}

jobs:

  build:
    if: ${{ !inputs.hardened && inputs.publish }}
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include: ${{ fromJson(inputs.runner_matrix || '[{"architecture":"amd64","runner":"ubuntu-24.04"},{"architecture":"arm64","runner":"sh-ubuntu-24.04-arm"}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run public dependency build
        if: ${{ !inputs.use_private_module_auth }}
        run: |
          docker build --provenance=false -t "${{ matrix.architecture }}" \
          --build-arg "project=${{ env.PROJECT }}" "${{ env.BUILD_CONTEXT }}"
      - name: Run private dependency build
        if: ${{ inputs.use_private_module_auth }}
        run: |
          docker build --provenance=false -t "${{ matrix.architecture }}" \
          --build-arg "project=${{ env.PROJECT }}" \
          --build-arg "github_username=${{ secrets.USERNAME }}" \
          --build-arg "github_token=${{ secrets.TOKEN }}" "${{ env.BUILD_CONTEXT }}"

      - name: Build and push Docker image
        run: |
          docker tag "${{ matrix.architecture }}" "ghcr.io/$ORGANIZATION/$PROJECT-platform:${{ matrix.architecture }}-${{ env.TAG }}"
          docker push "ghcr.io/$ORGANIZATION/$PROJECT-platform:${{ matrix.architecture }}-${{ env.TAG }}"

  create-manifest:
    if: ${{ !inputs.hardened && inputs.publish }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Wait for image propagation
        run: sleep 10
      - name: Create and push manifests
        shell: bash
        run: |
          mapfile -t image_refs < <(python3 - <<'PY'
          import json
          import os

          matrix = json.loads(os.environ["RUNNER_MATRIX"])
          for entry in matrix:
              print(f'ghcr.io/{os.environ["ORGANIZATION"]}/{os.environ["PROJECT"]}-platform:{entry["architecture"]}-{os.environ["TAG"]}')
          PY
          )

          docker manifest create "ghcr.io/$ORGANIZATION/$PROJECT:$TAG" "${image_refs[@]}"
          docker manifest push "ghcr.io/$ORGANIZATION/$PROJECT:$TAG"

          docker manifest create "ghcr.io/$ORGANIZATION/$PROJECT:latest" "${image_refs[@]}"
          docker manifest push "ghcr.io/$ORGANIZATION/$PROJECT:latest"

  hardened-source:
    if: inputs.hardened
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: Validate hardened release configuration
        env:
          SMOKE_QUEUE: ${{ inputs.smoke_queue }}
          PRIVATE_MODULE_AUTH: ${{ inputs.use_private_module_auth }}
          PUBLISH: ${{ inputs.publish }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          PROFILE: ${{ inputs.hardened_profile }}
          EXPECTED_ENTRYPOINT: ${{ inputs.hardened_entrypoint }}
          EXPECTED_COMMAND: ${{ inputs.hardened_command }}
          EXPECTED_WORKDIR: ${{ inputs.hardened_workdir }}
          MODULE_TOKEN: ${{ inputs.use_private_module_auth && secrets.TOKEN || '' }}
          ADDITIONAL_SMOKE: ${{ inputs.worker_additional_smoke }}
          PREDECLARE_QUORUM: ${{ inputs.smoke_predeclare_quorum }}
          ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
        run: |
          if [[ ! "$ARTIFACT_PREFIX" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "::error::artifact_prefix must contain only letters, digits and underscores"
            exit 1
          fi
          if ! jq -es 'length == 1 and (.[0] | . == null or (type == "array" and all(.[]; type == "string" and length > 0)))' \
            <<< "$EXPECTED_ENTRYPOINT" > /dev/null; then
            echo "::error::hardened_entrypoint must be null or a JSON array of non-empty strings"
            exit 1
          fi
          if [ -n "$EXPECTED_COMMAND" ] && ! jq -es 'length == 1 and (.[0] | type == "array" and all(.[]; type == "string" and length > 0))' \
            <<< "$EXPECTED_COMMAND" > /dev/null; then
            echo "::error::hardened_command must be a JSON array of non-empty strings"
            exit 1
          fi
          if jq -e '. == null or length == 0' <<< "$EXPECTED_ENTRYPOINT" > /dev/null; then
            if [ -z "$EXPECTED_COMMAND" ] || ! jq -e 'length > 0' <<< "$EXPECTED_COMMAND" > /dev/null; then
              echo "::error::hardened_entrypoint without an executable requires a non-empty hardened_command"
              exit 1
            fi
          fi
          if [ -n "$EXPECTED_WORKDIR" ] && [[ "$EXPECTED_WORKDIR" != /* ]]; then
            echo "::error::hardened_workdir must be an absolute path"
            exit 1
          fi
          case "$PROFILE" in
            worker|frontend|api|standalone|mongo-task) ;;
            *)
              echo "::error::unknown hardened image profile: $PROFILE"
              exit 1
              ;;
          esac
          if [ "$ADDITIONAL_SMOKE" = true ] && [ "$PROFILE" != worker ]; then
            echo "::error::worker_additional_smoke is only supported for worker images"
            exit 1
          fi
          if [ "$PREDECLARE_QUORUM" = true ] && [ "$PROFILE" != worker ]; then
            echo "::error::smoke_predeclare_quorum is only supported for worker images"
            exit 1
          fi
          if [ "$PROFILE" = worker ] && [ -z "$SMOKE_QUEUE" ]; then
            echo "::error::hardened releases require smoke_queue"
            exit 1
          fi
          if [ "$PRIVATE_MODULE_AUTH" != false ] && [ "$PROFILE" = frontend ]; then
            echo "::error::frontend releases require use_private_module_auth=false"
            exit 1
          fi
          if [ "$PRIVATE_MODULE_AUTH" = true ] && [ -z "$MODULE_TOKEN" ]; then
            echo "::error::private module authentication requires secrets.TOKEN for BuildKit"
            exit 1
          fi
          if [ "$PUBLISH" = true ] && [ -z "$RELEASE_TAG" ]; then
            echo "::error::publishing a hardened image requires an explicit release tag"
            exit 1
          fi
      - name: Scan repository secrets and configuration
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.76.1
          scan-type: fs
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: source-security.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.artifact_prefix }}-source
          path: source-security.json

  hardened-images:
    needs: hardened-source
    permissions:
      contents: read
      packages: write
    env:
      TRIVY_PLATFORM: linux/${{ matrix.architecture }}
      NATIVE_INVENTORY_POLICY: >-
        (.Metadata.OS.Family // "") as $family |
        ($family != "" and $family != "none" and $family != "unknown") and
        (.Metadata.OS.EOSL != true) and
        any(.Results[]?; .Class == "os-pkgs" and (.Packages | length > 0))
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.runner_matrix) }}
    runs-on: ${{ matrix.runner }}
    services:
      mongodb:
        image: ${{ (inputs.hardened_profile == 'worker' || inputs.hardened_profile == 'api' || inputs.hardened_profile == 'mongo-task') && 'mongo:8' || '' }}
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: ${{ (inputs.hardened_profile == 'worker' || inputs.hardened_profile == 'api') && (inputs.smoke_predeclare_quorum && 'rabbitmq:4-management-alpine' || 'rabbitmq:4-alpine') || '' }}
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Run native tests and vulnerability reachability checks
        env:
          GH_TOKEN: ${{ inputs.use_private_module_auth && secrets.TOKEN || '' }}
          DOCKERFILE: ${{ inputs.hardened_dockerfile }}
        run: |
          args=()
          if [ -n "$DOCKERFILE" ]; then
            args+=(--file "$DOCKERFILE")
          fi
          if [ -n "$GH_TOKEN" ]; then
            args+=(--secret "id=github_token,env=GH_TOKEN")
          fi
          docker buildx build "${args[@]}" --target test --progress=plain "$BUILD_CONTEXT"
      - name: Release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          {
            echo "version=${RELEASE_TAG:-dev}"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: Build final image for inspection
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.hardened_dockerfile }}
          load: true
          tags: hardened:scan
          secrets: ${{ inputs.use_private_module_auth && secrets.TOKEN != '' && format('github_token={0}', secrets.TOKEN) || '' }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ steps.metadata.outputs.revision }}
            CREATED=${{ steps.metadata.outputs.created }}
      - name: Inspect image contract
        env:
          PROFILE: ${{ inputs.hardened_profile }}
          EXPECTED_ENTRYPOINT: ${{ inputs.hardened_entrypoint }}
          EXPECTED_COMMAND: ${{ inputs.hardened_command }}
          EXPECTED_WORKDIR: ${{ inputs.hardened_workdir }}
          BROWSER_INVENTORY: ${{ inputs.hardened_profile == 'frontend' || inputs.browser_inventory }}
        run: |
          docker image inspect hardened:scan > image-inspect.json
          test "$(docker image inspect hardened:scan --format '{{.Config.User}}')" = 65532:65532
          test "$(docker image inspect hardened:scan --format '{{.Architecture}}')" = "${{ matrix.architecture }}"
          test "$(docker image inspect hardened:scan --format '{{json .Config.Entrypoint}}')" = "$(jq -c . <<< "$EXPECTED_ENTRYPOINT")"
          if [ -n "$EXPECTED_COMMAND" ]; then
            test "$(docker image inspect hardened:scan --format '{{json .Config.Cmd}}')" = "$(jq -c . <<< "$EXPECTED_COMMAND")"
          fi
          if [ -n "$EXPECTED_WORKDIR" ]; then
            test "$(docker image inspect hardened:scan --format '{{.Config.WorkingDir}}')" = "$EXPECTED_WORKDIR"
          fi
          container=$(docker create hardened:scan)
          docker export "$container" -o rootfs.tar
          docker rm "$container"
          tar -tf rootfs.tar > rootfs-files.txt
          tar -tvf rootfs.tar > rootfs-permissions.txt
          python3 - <<'PY'
          import json
          import os
          import posixpath
          import tarfile

          with open("image-inspect.json") as source:
              config = json.load(source)[0]["Config"]
          with tarfile.open("rootfs.tar") as archive:
              entries = {
                  posixpath.normpath(member.name).lstrip("/"): member
                  for member in archive.getmembers()
              }
          paths = {"etc", "etc/ssl", "etc/ssl/certs", "etc/ssl/certs/ca-certificates.crt"}
          directory = posixpath.normpath(config.get("WorkingDir") or "/")
          while directory not in ("", "/"):
              paths.add(directory.lstrip("/"))
              directory = posixpath.dirname(directory)
          if os.environ["PROFILE"] == "api":
              paths.update({"home/hub-api/keys", "home/hub-api/keys/public_key.pem"})
          for path in sorted(paths):
              member = entries.get(path)
              if member is None or not (member.isdir() or member.isfile()):
                  continue
              shift = 6 if member.uid == 65532 else 3 if member.gid == 65532 else 0
              permission = (1 if member.isdir() else 4) << shift
              if not member.mode & permission:
                  operation = "traverse" if member.isdir() else "read"
                  raise SystemExit(f"::error::runtime UID65532 cannot {operation} /{path}")
          PY
          if [ "$BROWSER_INVENTORY" = true ]; then
            mkdir frontend-inventory
            tar -xOf rootfs.tar usr/share/frontend/package.json > frontend-inventory/package.json
            tar -xOf rootfs.tar usr/share/frontend/package-lock.json > frontend-inventory/package-lock.json
          fi
          if [ "$PROFILE" = api ]; then
            test "$(docker image inspect hardened:scan --format '{{json .Config.Cmd}}')" = '["serve"]'
            test "$(docker image inspect hardened:scan --format '{{.Config.WorkingDir}}')" = /home/hub-api
            tar -xOf rootfs.tar home/hub-api/keys/public_key.pem | cmp api/keys/public_key.pem -
          fi
          if grep -E '(^|/)(s?bin)/(sh|bash|curl|wget|apt|apk|gcc|go)$' rootfs-files.txt; then
            echo "::error::runtime contains a prohibited shell, utility or build tool"
            exit 1
          fi
          if grep -E '^[-dlcbp][rwxStTs-]{2}[sS]|^[-dlcbp][rwxStTs-]{5}[sS]' rootfs-permissions.txt; then
            echo "::error::runtime contains a setuid or setgid executable"
            exit 1
          fi
      - name: Prepare legacy worker quorum queue
        if: inputs.hardened_profile == 'worker' && inputs.smoke_predeclare_quorum
        env:
          CI_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_QUEUE: ${{ inputs.smoke_queue }}
        run: |
          queue_path="$(jq -rn --arg queue "$SMOKE_QUEUE" '$queue | @uri')"
          curl -fsS --retry 20 --retry-connrefused --retry-delay 2 --retry-max-time 60 --max-time 5 \
            --user "ci:$CI_PASSWORD" -X PUT -H 'Content-Type: application/json' \
            --data-binary '{"durable":true,"arguments":{"x-queue-type":"quorum"}}' \
            "http://localhost:15672/api/queues/%2F/$queue_path"
      - name: Smoke test with a read-only filesystem and no capabilities
        if: inputs.hardened_profile == 'worker'
        env:
          CI_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_QUEUE: ${{ inputs.smoke_queue }}
        run: |
          docker run -d --name hardened-smoke --network host --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            -e MONGODB_URI=mongodb://127.0.0.1:27017 \
            -e MONGODB_DATABASE_CLOUD=Kerberos \
            -e QUEUE_SYSTEM=RABBITMQ \
            -e RABBITMQ_HOST=127.0.0.1:5672 -e RABBITMQ_EXCHANGE=ci \
            -e RABBITMQ_USERNAME=ci -e RABBITMQ_PASSWORD="$CI_PASSWORD" hardened:scan
          ready=false
          for attempt in $(seq 1 30); do
            echo "Smoke readiness attempt $attempt/30"
            if curl --fail --max-time 2 http://127.0.0.1:8080/metrics > /dev/null &&
              docker exec "${{ job.services.rabbitmq.id }}" rabbitmqctl list_queues name consumers |
                awk -v queue="$SMOKE_QUEUE" '$1 == queue && $2 == 1 { found = 1 } END { exit !found }'; then
              ready=true
              break
            fi
            sleep 2
          done
          docker logs hardened-smoke > smoke.log 2>&1
          docker rm -f hardened-smoke
          test "$ready" = true
      - name: Smoke test frontend routing and runtime configuration
        if: inputs.hardened_profile == 'frontend'
        run: bash image/smoke-test.sh hardened:scan
      - name: Smoke test API HTTP and database readiness
        if: inputs.hardened_profile == 'api'
        env:
          CI_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          RABBITMQ_CONTAINER: ${{ job.services.rabbitmq.id }}
        run: bash image/smoke-test.sh hardened:scan
      - name: Smoke test repository runtime contract
        if: inputs.hardened_profile == 'standalone' || inputs.hardened_profile == 'mongo-task' || (inputs.hardened_profile == 'worker' && inputs.worker_additional_smoke)
        env:
          CI_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_QUEUE: ${{ inputs.smoke_queue }}
          RABBITMQ_CONTAINER: ${{ job.services.rabbitmq.id }}
          GH_TOKEN: ${{ inputs.use_private_module_auth && secrets.TOKEN || '' }}
          RUNTIME_EVIDENCE_DIR: runtime-evidence
          DOCKERFILE: ${{ inputs.hardened_dockerfile }}
        run: bash image/smoke-test.sh hardened:scan
      - name: Scan final image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.76.1
          image-ref: hardened:scan
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: ""
          format: json
          output: image-security.json
          exit-code: "0"
      - name: Scan browser dependency inventory
        if: inputs.hardened_profile == 'frontend' || inputs.browser_inventory
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: frontend-inventory
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: ""
          format: json
          output: browser-security.json
          exit-code: "0"
      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.76.1
          image-ref: hardened:scan
          format: spdx-json
          output: image.spdx.json
      - name: Generate browser dependency SPDX SBOM
        if: inputs.hardened_profile == 'frontend' || inputs.browser_inventory
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: frontend-inventory
          format: spdx-json
          output: browser.spdx.json
      - name: Verify installed APK catalog completeness
        run: |
          set -euo pipefail
          export LC_ALL=C
          test -f rootfs-files.txt
          if database=$(grep -E '^(\./)?(usr/)?lib/apk/db/installed$' rootfs-files.txt); then
            mkdir -p runtime-evidence
            tar -xOf rootfs.tar "$database" > runtime-evidence/release-apk-installed
            awk '
              BEGIN { RS = ""; FS = "\n" }
              {
                package = version = ""
                names = versions = 0
                for (field = 1; field <= NF; field++) {
                  if (substr($field, 1, 2) == "P:") {
                    package = substr($field, 3)
                    names++
                  }
                  if (substr($field, 1, 2) == "V:") {
                    version = substr($field, 3)
                    versions++
                  }
                }
                if (names != 1 || versions != 1 || package == "" || version == "") {
                  print "::error::invalid installed APK name/version record" > "/dev/stderr"
                  exit 1
                }
                print package "\t" version
              }
            ' runtime-evidence/release-apk-installed | sort -u > runtime-evidence/release-apk-pairs.tsv
            if [ ! -s runtime-evidence/release-apk-pairs.tsv ]; then
              echo "::error::installed APK database contains no package name/version pairs"
              exit 1
            fi
            jq -r '.Results[] | select(.Class == "os-pkgs") | .Packages[] | [.Name, .Version] | @tsv' \
              image-security.json | sort -u > runtime-evidence/release-scanner-os-pairs.tsv
            jq -r '.packages[] | select(any(.externalRefs[]?; .referenceType == "purl" and (.referenceLocator | startswith("pkg:apk/")))) | [.name, .versionInfo] | @tsv' \
              image.spdx.json | sort -u > runtime-evidence/release-spdx-os-pairs.tsv
            for catalog in scanner spdx; do
              if ! diff -u runtime-evidence/release-apk-pairs.tsv "runtime-evidence/release-$catalog-os-pairs.tsv"; then
                echo "::error::installed APK packages do not equal the $catalog inventory"
                exit 1
              fi
            done
          else
            echo "No installed APK database; APK catalog equality does not apply"
          fi
      - name: Enforce vulnerability and secret policy
        env:
          BROWSER_INVENTORY: ${{ inputs.hardened_profile == 'frontend' || inputs.browser_inventory }}
        run: |
          test -f rootfs-files.txt
          if grep -Eq '(^|/)(lib/apk/db/installed|var/lib/dpkg/status|var/lib/dpkg/status\.d(/.*)?)/?$' rootfs-files.txt; then
            if ! jq -e "$NATIVE_INVENTORY_POLICY" image-security.json; then
              echo "::error::runtime package database requires supported OS detection and scanned OS packages"
              exit 1
            fi
          fi
          reports=(image-security.json)
          if [ "$BROWSER_INVENTORY" = true ]; then
            reports+=(browser-security.json)
          fi
          jq -se '[.[].Results[]? | ((.Vulnerabilities[]? | select(.Severity == "MEDIUM" or .Severity == "HIGH" or .Severity == "CRITICAL")), .Secrets[]?)] | length == 0' "${reports[@]}"
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish staged image with provenance and SBOM
        if: inputs.publish
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.hardened_dockerfile }}
          push: true
          secrets: ${{ inputs.use_private_module_auth && secrets.TOKEN != '' && format('github_token={0}', secrets.TOKEN) || '' }}
          tags: ghcr.io/${{ env.ORGANIZATION }}/${{ env.PROJECT }}-platform:staging-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.architecture }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ steps.metadata.outputs.revision }}
            CREATED=${{ steps.metadata.outputs.created }}
      - name: Scan immutable published image
        if: inputs.publish
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.76.1
          image-ref: ghcr.io/${{ env.ORGANIZATION }}/${{ env.PROJECT }}-platform@${{ steps.publish.outputs.digest }}
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: ""
          format: json
          output: published-image-security.json
          exit-code: "0"
      - name: Gate immutable published image
        if: inputs.publish
        run: |
          set -euo pipefail
          export LC_ALL=C
          test -f rootfs-files.txt
          if grep -Eq '(^|/)(lib/apk/db/installed|var/lib/dpkg/status|var/lib/dpkg/status\.d(/.*)?)/?$' rootfs-files.txt; then
            if ! jq -e "$NATIVE_INVENTORY_POLICY" published-image-security.json; then
              echo "::error::published runtime package database requires supported OS detection and scanned OS packages"
              exit 1
            fi
          fi
          if grep -Eq '^(\./)?(usr/)?lib/apk/db/installed$' rootfs-files.txt; then
            if [ ! -s runtime-evidence/release-apk-pairs.tsv ]; then
              echo "::error::installed APK package evidence is missing"
              exit 1
            fi
            jq -r '.Results[] | select(.Class == "os-pkgs") | .Packages[] | [.Name, .Version] | @tsv' \
              published-image-security.json | sort -u > runtime-evidence/release-published-os-pairs.tsv
            if ! diff -u runtime-evidence/release-apk-pairs.tsv runtime-evidence/release-published-os-pairs.tsv; then
              echo "::error::published APK scan does not match the inspected installed packages"
              exit 1
            fi
          fi
          jq -e '[.Results[]? | ((.Vulnerabilities[]? | select(.Severity == "MEDIUM" or .Severity == "HIGH" or .Severity == "CRITICAL")), .Secrets[]?)] | length == 0' published-image-security.json
      - name: Record immutable digest and base references
        if: inputs.publish
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          DOCKERFILE: ${{ inputs.hardened_dockerfile }}
        run: |
          printf '%s\n' "$DIGEST" > digest-${{ matrix.architecture }}.txt
          dockerfile="${DOCKERFILE:-$BUILD_CONTEXT/Dockerfile}"
          grep '^FROM ' "$dockerfile" > base-images.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.artifact_prefix }}-image-${{ matrix.architecture }}
          path: |
            image-security.json
            browser-security.json
            published-image-security.json
            image.spdx.json
            browser.spdx.json
            frontend-inventory
            image-inspect.json
            rootfs-files.txt
            rootfs-permissions.txt
            digest-*.txt
            base-images.txt
            smoke.log
            *-smoke.log
            runtime-evidence

  hardened-manifest:
    if: inputs.hardened && inputs.publish
    needs: hardened-images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact_prefix }}-image-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@v3
      - name: Assemble and verify staged multi-platform manifest
        env:
          IMAGE: ghcr.io/${{ env.ORGANIZATION }}/${{ env.PROJECT }}
          PLATFORM_IMAGE: ghcr.io/${{ env.ORGANIZATION }}/${{ env.PROJECT }}-platform
        run: |
          set -euo pipefail
          image_refs=()
          for file in digest-*.txt; do
            test -f "$file"
            image_refs+=("$PLATFORM_IMAGE@$(cat "$file")")
          done
          staging="$IMAGE:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create -t "$staging" "${image_refs[@]}"
          docker buildx imagetools inspect "$staging" --raw > manifest.json
          digest=$(docker buildx imagetools inspect "$staging" --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign --yes "$IMAGE@$digest"
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/uug-ai/workflows/\.github/workflows/release-create\.yml@(refs/\S+|[0-9a-f]{40})$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$digest" > signature-verification.json
          printf '%s\n' "$digest" > verified-digest.txt
          echo "$IMAGE@$digest" | tee image-digest.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Promote verified image tags
        env:
          IMAGE: ghcr.io/${{ env.ORGANIZATION }}/${{ env.PROJECT }}
          PLATFORM_IMAGE: ghcr.io/${{ env.ORGANIZATION }}/${{ env.PROJECT }}-platform
        run: |
          set -euo pipefail
          promote() {
            local target="$1" repository="$2" expected="$3" actual
            docker buildx imagetools create -t "$target" "$repository@$expected"
            actual=$(docker buildx imagetools inspect "$target" --format '{{json .Manifest.Digest}}' | tr -d '"')
            if [ "$actual" != "$expected" ]; then
              echo "::error::Promoted digest for $target does not match verified digest $expected"
              exit 1
            fi
          }

          digest=$(cat verified-digest.txt)
          for file in digest-*.txt; do
            test -f "$file"
            architecture=${file#digest-}
            architecture=${architecture%.txt}
            promote "$PLATFORM_IMAGE:$architecture-$TAG" "$PLATFORM_IMAGE" "$(cat "$file")"
          done
          promote "$IMAGE:$TAG" "$IMAGE" "$digest"
          promote "$IMAGE:latest" "$IMAGE" "$digest"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-release
          path: |
            manifest.json
            image-digest.txt
            signature-verification.json
      - name: Finalize verified GitHub release
        if: inputs.finalize_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          case "$draft" in
            true)
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --verify-tag
              ;;
            false)
              echo "Release $TAG is already published; preserving its publication state."
              ;;
            *)
              echo "::error::Unexpected draft state for release $TAG: $draft"
              exit 1
              ;;
          esac

  update-gitops:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    needs: [create-manifest, hardened-manifest]
    if: ${{ always() && !cancelled() && inputs.create_gitops_pr && inputs.publish && (needs.create-manifest.result == 'success' || needs.hardened-manifest.result == 'success') }}
    steps:
      # After we build the Docker image, we create a pull request to update the GitOps repository
      # This will allow us to update the Helm chart with the new Docker image tag.
      - name: Create GitOps Pull Request
        uses: cedricve/gitops-pullrequest-action@master
        with:
          github-token: ${{ secrets.TOKEN }}
          gitops-repo: "${{ env.GITOPS_REPO }}"
          gitops-file: "${{ env.GITOPS_FILE }}"
          gitops-pr-branch: "${{ env.GITOPS_PR_BRANCH }}"
          gitops-key: "${{ env.GITOPS_KEY }}"
          gitops-value: "${{ env.GITOPS_VALUE }}"
          commit-email: "${{ env.COMMIT_EMAIL }}"
          commit-name: "${{ env.COMMIT_NAME }}"
          commit-message: "${{ env.COMMIT_MESSAGE }}"
