name: Validate Workflows

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - name: Run actionlint
        run: ./actionlint -color

  reusable-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pyyaml
      - name: Validate reusable workflow contracts
        run: python check_workflows.py
      - name: Test release safety contracts
        run: python -m unittest test_check_workflows
      - name: Test pull request description generator
        run: python -m unittest discover -s .github/actions/pr-description -p 'test_*.py'
      - name: Test GitOps release notes
        run: node --test tests/release-notes.test.cjs

  legacy-release-permissions:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-create.yml
    with:
      publish: false
      use_private_module_auth: false
      docker_context: .github/fixtures/release
      runner_matrix: '[{"architecture":"amd64","runner":"ubuntu-24.04"}]'
