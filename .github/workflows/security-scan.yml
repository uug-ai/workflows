name: Security scan

on:
  workflow_call:
    inputs:
      project:
        description: 'Project or repository name'
        required: false
        type: string
        default: ''
      docker_context:
        description: 'Docker build context'
        required: false
        type: string
        default: '.'
      trivy_version:
        description: 'Trivy version to install'
        required: false
        type: string
        default: '0.69.3'
      trivy_severity:
        description: 'Comma-separated Trivy severities'
        required: false
        type: string
        default: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'
    secrets:
      USERNAME:
        required: true
      TOKEN:
        required: true

env:
  PROJECT: ${{ inputs.project || github.event.repository.name }}
  BUILD_CONTEXT: ${{ inputs.docker_context || '.' }}

jobs:
  security-scan:
    runs-on: ubuntu-latest
    env:
      COMMIT_SHA: ${{ github.sha }}

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the Docker image with the latest tag and the release tag
      # Build the Docker image with the latest tag and the release tag
      - name: Build Docker image with PR tag
        run: |
          docker build -t "${{ env.PROJECT }}" \
          --build-arg "project=${{ env.PROJECT }}" \
          --build-arg "github_username=${{ secrets.USERNAME }}" \
          --build-arg "github_token=${{ secrets.TOKEN }}" "${{ env.BUILD_CONTEXT }}"

      # This is a workaround for the issue with the Trivy DBs not being available due to
      # rate limiting. The workaround is to download the DBs and cache them.
      - name: Setup oras
        uses: oras-project/setup-oras@v1
      - name: Download and extract the vulnerability DB
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/trivy/db"
          oras pull ghcr.io/aquasecurity/trivy-db:2
          tar -xzf db.tar.gz -C "$GITHUB_WORKSPACE/.cache/trivy/db"

      # Install Trivy directly from release artifacts
      - name: Install Trivy
        run: |
          TRIVY_VERSION="${{ inputs.trivy_version || '0.69.3' }}"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /tmp
          sudo mv /tmp/trivy /usr/local/bin/trivy
          trivy --version

      # Run the Trivy vulnerability scanner on the built image
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          skip-setup-trivy: true
          scan-type: "image"
          image-ref: ${{ env.PROJECT }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: "os,library"
          severity: ${{ inputs.trivy_severity || 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN' }}
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy