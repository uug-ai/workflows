name: Bump release
on:
  workflow_call:
    inputs:
      bump:
        description: 'Which part of the version to bump (major, minor, patch, or hotfix with hotfix_base)'
        required: false
        type: string
        default: 'patch'
      draft:
        description: 'Reserve the source tag and keep the release draft until verified publication'
        type: boolean
        default: false
      hotfix_base:
        description: 'Release to hotfix with bump hotfix, such as v1.19.29 or one of its hotfixes (v1.19.29.1); tags the head of release/<base> as the next <base>.N'
        required: false
        type: string
        default: ''
    outputs:
      tag:
        description: 'The newly created release tag'
        value: ${{ jobs.bump-release.outputs.tag }}

permissions:
  contents: write

jobs:
  bump-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          HOTFIX_BASE: ${{ inputs.hotfix_base }}
        run: |
          set -euo pipefail

          if [ "$BUMP" = hotfix ] && [ -z "$HOTFIX_BASE" ]; then
            echo "::error::A hotfix needs the release to fix in hotfix_base, such as v1.19.29"
            exit 1
          fi
          if [ "$BUMP" != hotfix ] && [ -n "$HOTFIX_BASE" ]; then
            echo "::error::hotfix_base is only used with bump hotfix (got bump $BUMP); choose hotfix or clear hotfix_base"
            exit 1
          fi

          if [ "$BUMP" = hotfix ]; then
            # Accept v1.19.29, 1.19.29 or a hotfix of it such as v1.19.29.1.
            requested=$(printf '%s' "$HOTFIX_BASE" | tr -d '[:space:]')
            if ! printf '%s' "$requested" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
              echo "::error::hotfix_base must be a release such as v1.19.29 or v1.19.29.1, got '$HOTFIX_BASE'"
              exit 1
            fi
            requested="v${requested#v}"
            base=$(printf '%s' "$requested" | cut -d. -f1-3)
            if [ "$requested" != "$base" ]; then
              echo "Using base release $base for $requested"
            fi
            if ! git rev-parse -q --verify "refs/tags/$base" >/dev/null; then
              echo "::error::Release tag $base does not exist"
              exit 1
            fi
            branch="release/$base"
            if ! git rev-parse -q --verify "refs/remotes/origin/$branch" >/dev/null; then
              echo "::error::Branch $branch does not exist; create it from $base and merge the hotfix into it first"
              exit 1
            fi
            target=$(git rev-parse "refs/remotes/origin/$branch^{commit}")
            if ! git merge-base --is-ancestor "$base" "$target"; then
              echo "::error::$branch ($target) does not contain $base"
              exit 1
            fi

            escaped=${base//./\\.}
            previous=$(git tag --list "$base.*" | grep -E "^${escaped}\.[0-9]+$" | sort -V | tail -n 1 || true)
            if [ -n "$previous" ]; then
              last=${previous##*.}
            else
              previous="$base"
              last=0
            fi
            if git tag --points-at "$target" | grep -Eqx "${escaped}(\.[0-9]+)?"; then
              echo "::error::The head of $branch ($target) is already released; merge the hotfix into $branch first"
              exit 1
            fi

            next="$base.$((last + 1))"
            echo "Hotfix of $base from $branch at $target (previous: $previous)"
            echo "Next tag: $next"
            {
              echo "tag=$next"
              echo "target=$target"
              echo "notes_start=$previous"
              echo "latest=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Latest three-part semver tag; hotfix tags (vX.Y.Z.N) are ignored.
          # Default to v0.0.0 when none exist.
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          echo "Latest tag: $latest"

          # Strip the leading "v" and split into components.
          version="${latest#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"

          case "$BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unknown bump type: $BUMP" >&2
              exit 1
              ;;
          esac

          next="v${major}.${minor}.${patch}"
          echo "Next tag: $next"
          {
            echo "tag=$next"
            echo "target=$GITHUB_SHA"
            echo "notes_start="
            echo "latest=true"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ steps.version.outputs.target }}
          NOTES_START: ${{ steps.version.outputs.notes_start }}
          LATEST: ${{ steps.version.outputs.latest }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          target="${TARGET:-$GITHUB_SHA}"
          options=()
          if [ -n "${NOTES_START:-}" ]; then
            options+=(--notes-start-tag "$NOTES_START")
          fi
          if [ "${LATEST:-true}" = false ]; then
            options+=(--latest=false)
          fi
          if [ "$DRAFT" = true ]; then
            # Draft releases do not reliably create a checkoutable source tag.
            git tag "$TAG" "$target"
            git push origin "refs/tags/$TAG"
            options+=(--draft --verify-tag)
          fi
          gh release create "$TAG" \
            --target "$target" \
            --title "$TAG" \
            --generate-notes "${options[@]}"
