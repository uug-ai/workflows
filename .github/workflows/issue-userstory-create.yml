name: Create User Story Issue
on:
  workflow_call:
    inputs:
      issue_title:
        description: 'Title for the issue'
        required: true
        type: string
      issue_description:
        description: 'Brief description of the feature'
        required: true
        type: string
      complexity:
        description: 'Complexity of the feature'
        required: true
        type: string
      duration:
        description: 'Estimated duration'
        required: true
        type: string
      openai_model:
        description: 'Model passed to the issue creation action'
        required: false
        type: string
        default: 'gpt-4o'
      azure_openai_endpoint:
        description: 'Azure OpenAI endpoint'
        required: false
        type: string
        default: ''
      azure_openai_version:
        description: 'Azure OpenAI API version'
        required: false
        type: string
        default: ''
      labels:
        description: 'Comma-separated labels to apply'
        required: false
        type: string
        default: 'user-story,feature'
      assignees:
        description: 'Comma-separated assignees'
        required: false
        type: string
        default: ''
    secrets:
      AZURE_OPENAI_API_KEY:
        required: true
      github_token:
        required: false

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create Issue with User Story
        uses: cedricve/llm-create-issue-user-story@main
        with:
          github_token: ${{ secrets.github_token || github.token }}
          azure_openai_api_key: ${{ secrets.AZURE_OPENAI_API_KEY }}
          azure_openai_endpoint: ${{ inputs.azure_openai_endpoint || vars.AZURE_OPENAI_ENDPOINT }}
          azure_openai_version: ${{ inputs.azure_openai_version || vars.AZURE_OPENAI_VERSION }}
          openai_model: ${{ inputs.openai_model || 'gpt-4o' }}
          issue_title: ${{ inputs.issue_title }}
          issue_description: ${{ inputs.issue_description }}
          complexity: ${{ inputs.complexity }}
          duration: ${{ inputs.duration }}
          labels: ${{ inputs.labels || 'user-story,feature' }}
          assignees: ${{ inputs.assignees || github.actor }}