name: Build pull request
on:
  workflow_call:
    inputs:
      organization:
        description: 'Container organization or owner'
        required: false
        type: string
        default: 'uug-ai'
      project:
        description: 'Project or repository name'
        required: false
        type: string
        default: ''
      language:
        description: 'Application language used by the workflow'
        required: false
        type: string
        default: 'go'
      go_version:
        description: 'Go version to install when language is go'
        required: false
        type: string
        default: '1.25'
      go_dir:
        description: 'Directory containing the Go module when language is go'
        required: false
        type: string
        default: 'api'
      go_sum_path:
        description: 'Path used for Go dependency caching when language is go'
        required: false
        type: string
        default: 'api/go.sum'
      go_test_race:
        description: 'Enable Go race detector during tests; sets CGO_ENABLED=1 for the test step'
        required: false
        type: boolean
        default: false
      use_private_module_auth:
        description: 'Configure USERNAME/TOKEN authentication for private Go modules and Docker builds'
        required: false
        type: boolean
        default: true
      registry_login:
        description: 'Log in to GHCR before building the image'
        required: false
        type: boolean
        default: true
      docker_context:
        description: 'Docker build context'
        required: false
        type: string
        default: '.'
      runner_matrix:
        description: 'JSON array of objects with architecture and runner keys'
        required: false
        type: string
        default: '[{"architecture":"amd64","runner":"ubuntu-24.04"},{"architecture":"arm64","runner":"sh-ubuntu-24.04-arm"}]'
    secrets:
      USERNAME:
        required: false
      TOKEN:
        required: false

env:
  ORGANIZATION: ${{ inputs.organization || 'uug-ai' }}
  PROJECT: ${{ inputs.project || github.event.repository.name }}
  LANGUAGE: ${{ inputs.language || 'go' }}
  GO_VERSION: ${{ inputs.go_version || '1.25' }}
  GO_DIR: ${{ inputs.go_dir || 'api' }}
  GO_SUM_PATH: ${{ inputs.go_sum_path || 'api/go.sum' }}
  GO_TEST_RACE: ${{ inputs.go_test_race && 'true' || 'false' }}
  BUILD_CONTEXT: ${{ inputs.docker_context || '.' }}

jobs:

  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include: ${{ fromJson(inputs.runner_matrix || '[{"architecture":"amd64","runner":"ubuntu-24.04"},{"architecture":"arm64","runner":"sh-ubuntu-24.04-arm"}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        if: ${{ env.LANGUAGE == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
          check-latest: true
          cache-dependency-path: ${{ env.GO_SUM_PATH }}
      - name: Configure private module authentication
        if: ${{ env.LANGUAGE == 'go' && inputs.use_private_module_auth }}
        run: git config --global url."https://${{ secrets.USERNAME }}:${{ secrets.TOKEN }}@github.com/".insteadOf "https://github.com/"
      # Test the Golang application
      - name: Test Golang application
        if: ${{ env.LANGUAGE == 'go' }}
        shell: bash
        run: |
          cd "${{ env.GO_DIR }}"
          mapfile -t packages < <(go list ./... | grep -v /vendor/)
          go fmt "${packages[@]}"
          go vet "${packages[@]}"
          if [[ "${GO_TEST_RACE}" == 'true' ]]; then
            export CGO_ENABLED=1
            go test -race "${packages[@]}"
          else
            go test "${packages[@]}"
          fi
      # Build the Golang application to the dist folder
      - name: Build Golang application
        if: ${{ env.LANGUAGE == 'go' }}
        run: |
          cd "${{ env.GO_DIR }}"
          go build -o main
      - name: Log in to GitHub Container Registry
        if: ${{ inputs.registry_login }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.TOKEN }}
      - name: Run Build
        shell: bash
        run: |
          build_args=(--build-arg "project=${{ env.PROJECT }}")
          if [[ "${{ inputs.use_private_module_auth }}" == "true" ]]; then
            build_args+=(
              --build-arg "github_username=${{ secrets.USERNAME }}"
              --build-arg "github_token=${{ secrets.TOKEN }}"
            )
          fi
          docker build -t "${{ matrix.architecture }}" "${build_args[@]}" "${{ env.BUILD_CONTEXT }}"