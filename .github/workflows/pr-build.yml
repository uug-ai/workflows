name: Build pull request
on:
  workflow_call:
    inputs:
      organization:
        description: 'Container organization or owner'
        required: false
        type: string
        default: 'uug-ai'
      project:
        description: 'Project or repository name'
        required: false
        type: string
        default: ''
      go_version:
        description: 'Go version to install'
        required: false
        type: string
        default: '1.25'
      go_dir:
        description: 'Directory containing the Go module'
        required: false
        type: string
        default: 'api'
      go_sum_path:
        description: 'Path used for Go dependency caching'
        required: false
        type: string
        default: 'api/go.sum'
      docker_context:
        description: 'Docker build context'
        required: false
        type: string
        default: '.'
      runner_matrix:
        description: 'JSON array of objects with architecture and runner keys'
        required: false
        type: string
        default: '[{"architecture":"amd64","runner":"ubuntu-24.04"},{"architecture":"arm64","runner":"sh-ubuntu-24.04-arm"}]'
    secrets:
      USERNAME:
        required: true
      TOKEN:
        required: true

env:
  ORGANIZATION: ${{ inputs.organization || 'uug-ai' }}
  PROJECT: ${{ inputs.project || github.event.repository.name }}
  GO_VERSION: ${{ inputs.go_version || '1.25' }}
  GO_DIR: ${{ inputs.go_dir || 'api' }}
  GO_SUM_PATH: ${{ inputs.go_sum_path || 'api/go.sum' }}
  BUILD_CONTEXT: ${{ inputs.docker_context || '.' }}

jobs:

  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include: ${{ fromJson(inputs.runner_matrix || '[{"architecture":"amd64","runner":"ubuntu-24.04"},{"architecture":"arm64","runner":"sh-ubuntu-24.04-arm"}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
          check-latest: true
          cache-dependency-path: ${{ env.GO_SUM_PATH }}
      # Test the Golang application
      - name: Test Golang application
        shell: bash
        run: |
          cd "${{ env.GO_DIR }}"
          git config --global url."https://${{ secrets.USERNAME }}:${{ secrets.TOKEN }}@github.com/".insteadOf "https://github.com/"
          mapfile -t packages < <(go list ./... | grep -v /vendor/)
          go fmt "${packages[@]}"
          go vet "${packages[@]}"
          go test -race "${packages[@]}"
      # Build the Golang application to the dist folder
      - name: Build Golang application
        run: |
          cd "${{ env.GO_DIR }}"
          git config --global url."https://${{ secrets.USERNAME }}:${{ secrets.TOKEN }}@github.com/".insteadOf "https://github.com/"
          go build -o main
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.TOKEN }}
      - name: Run Build
        run: |
          docker build -t "${{ matrix.architecture }}" \
          --build-arg "project=${{ env.PROJECT }}" \
          --build-arg "github_username=${{ secrets.USERNAME }}" \
          --build-arg "github_token=${{ secrets.TOKEN }}" "${{ env.BUILD_CONTEXT }}"